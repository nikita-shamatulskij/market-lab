<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarketLab</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800;900&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

</head>

<body>
<header class="header">
    <div class="brand-section">
        <div class="slogan">"Tech Tested, Market Approved"</div>
        <div class="marketlab-title">MARKETLAB</div>
    </div>

    <div class="nav-buttons">
        <!-- КНОПКА ВОЙТИ (остается, но удаляется после входа и заменяется на Профиль) -->
        <a href="#" class="nav-button" id="loginButton">
            <div class="icon-square">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                     stroke="black" style="width: 24px; height: 24px;">
                    <path stroke-linecap="round" stroke-linejoin="round"
                          d="M17.982 18.725A7.488 7.488 0 0 0 12 15.75a7.488 7.488 0 0 0-5.982 2.975m11.963 0a9 9 0 1 0-11.963 0m11.963 0A8.966 8.966 0 0 1 12 21a8.966 8.966 0 0 1-5.982-2.275M15 9.75a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                </svg>
            </div>
            <span class="button-text">Войти</span>
        </a>

        <a href="/cart" class="nav-button"> <!-- Исправлено -->
            <div class="icon-square">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                     stroke="black" style="width: 22px; height: 22px;">
                    <path stroke-linecap="round" stroke-linejoin="round"
                          d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 0 0-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 0 0 0-16.536-1.84M7.5 14.25 5.106 5.272M6 20.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Zm12.75 0a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Z" />
                </svg>
            </div>
            <span class="button-text">Корзина</span>
        </a>

        <div class="nav-button" id="categoriesDropdown">
            <div class="icon-square">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                     stroke="black" style="width: 24px; height: 24px;">
                    <path stroke-linecap="round" stroke-linejoin="round"
                          d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
                </svg>
            </div>
            <span class="button-text">Категории</span>
        </div>
    </div>
</header>

<main>
    <section class="search-section">
        <div class="search-container">
            <div class="search-icon">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                     stroke="#7D7D7D" style="width: 24px; height: 24px;">
                    <path stroke-linecap="round" stroke-linejoin="round"
                          d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
                </svg>
            </div>
            <input type="text" id="searchInput" placeholder="Найти на MARKETLAB" class="search-input">
        </div>
    </section>

    <section class="products-section">
        <div class="products-grid" id="productsGrid">
            <div class="product-card" th:each="product : ${products}">
                <a th:href="@{/product/{id}(id=${product.id})}" class="product-link">
                    <div class="product-image">
                        <img th:src="${product.imageUrl}" th:alt="${product.name}" class="product-img">
                    </div>

                    <div class="product-info">
                        <h3 class="product-title" th:text="${product.name}">Название товара</h3>

                        <div class="product-actions">
                            <!-- Кнопка избранного без onclick -->
                            <button class="favorite-btn action-btn"
                                    type="button"
                                    th:attr="data-product-id=${product.id}"
                                    title="Добавить в избранное">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                     stroke-width="1.5" stroke="currentColor" class="favorite-icon">
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                          d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z" />
                                </svg>
                            </button>

                            <!-- Кнопка корзины -->
                            <button class="action-btn cart-btn" type="button">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                     stroke-width="1.5" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                          d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 0 0-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 0 0 0-16.536-1.84M7.5 14.25 5.106 5.272M6 20.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Zm12.75 0a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Z" />
                                </svg>
                            </button>
                        </div>

                        <div class="product-price"
                             th:text="${#numbers.formatDecimal(product.price, 1, 2, 'POINT') + ' ₽'}">
                            0 ₽
                        </div>
                    </div>
                </a>
            </div>


            <div th:if="${products.isEmpty()}" class="no-products">
                <p>😔 Товаров пока нет</p>
                <small>Попробуйте позже</small>
            </div>
        </div>
    </section>
</main>

<div id="loginModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Вход в MARKETLAB</h2>
            <span class="close">&times;</span>
        </div>
        <form class="login-form">
            <input type="text" placeholder="Email или логин" required>
            <input type="password" placeholder="Пароль" required>
            <button type="submit">Войти</button>
        </form>
        <div class="modal-links">
            <a href="#">Создать аккаунт</a>
        </div>
    </div>
</div>

<div id="registerModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Регистрация в MARKETLAB</h2>
            <span class="close-register">&times;</span>
        </div>
        <form class="register-form" id="registerForm">
            <input type="text" name="firstName" placeholder="Имя" required>
            <input type="text" name="middleName" placeholder="Отчество">
            <input type="text" name="lastName" placeholder="Фамилия" required>
            <input type="email" name="email" placeholder="Email" required>
            <input type="password" name="password" placeholder="Пароль" required>
            <input type="tel" name="phoneNumber" placeholder="Номер телефона">
            <button type="submit">Зарегистрироваться</button>
        </form>
        <div class="modal-links">
            <a href="#" class="switch-to-login">Уже есть аккаунт? Войти</a>
        </div>
    </div>
</div>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="categories-sidebar" id="categoriesSidebar">
    <div class="sidebar-header">
        <h3 class="sidebar-title">Категории</h3>
        <button class="close-sidebar" id="closeSidebar">&times;</button>
    </div>
    <div class="sidebar-categories">
        <a th:each="category : ${categories}"
           th:data-category-id="${category.id}"
           th:text="${category.name}"
           class="sidebar-category">
            Категория
        </a>
        <div class="sidebar-divider"></div>
        <a href="#" class="sidebar-category sidebar-all-categories">🔄 Все товары</a>
    </div>
</div>

<div id="cartRoot"></div>

<script src="/js/auth.js"></script>
<script src="/js/favorites.js"></script>
<script src="/js/main.js"></script>
<script src="/js/search.js"></script>
<script src="/js/cart.js"></script>

</body>
</html>
