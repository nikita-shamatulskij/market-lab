<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:insert="layout :: html">
<head>
    <title>MarketLab</title>
    <style>
        .hero-section {
            background: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-family: 'Inter', sans-serif;
        }

        .hero-content {
            max-width: 800px;
            padding: 2rem;
        }

        .slogan {
            font-size: 1.1rem;
            font-weight: 300;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-bottom: 3rem;
            opacity: 0.8;
        }

        .marketlab-title {
            font-size: 6rem;
            font-weight: 900;
            line-height: 1;
            margin-bottom: 4rem;
            letter-spacing: -0.02em;
        }

        .search-container {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            padding: 1rem 2rem;
            max-width: 400px;
            margin: 0 auto;
            backdrop-filter: blur(10px);
        }

        .search-input {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 1rem;
            width: 100%;
            text-align: center;
            outline: none;
            font-weight: 400;
        }

        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.6);
            font-weight: 300;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;900&display=swap" rel="stylesheet">
</head>
<body>
<div th:fragment="content">
    <section class="hero-section">
        <div class="hero-content">
            <div class="slogan">“Tech Tested, Market Approved”</div>
            <h1 class="marketlab-title">MARKETLAB</h1>
            <form th:action="@{/products}" method="get" class="search-container">
                <input type="text" name="search" placeholder="Найти на MARKETLAB" class="search-input">
            </form>
        </div>
    </section>
</div>
</body>
</html>
