<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Корзина - MarketLab</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800;900&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        .cart-page {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            min-height: 60vh;
        }
        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #eee;
            padding-bottom: 15px;
        }
        .cart-title {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 2rem;
            color: #000;
        }
        .cart-items {
            margin-bottom: 30px;
        }
        .cart-item {
            display: flex;
            gap: 20px;
            padding: 20px;
            border: 1px solid #eee;
            border-radius: 12px;
            margin-bottom: 15px;
            background: white;
            transition: box-shadow 0.3s ease;
        }
        .cart-item:hover {
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .item-image img {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 8px;
        }
        .item-details {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .item-name {
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            font-size: 1.2rem;
            margin-bottom: 10px;
            color: #000;
        }
        .item-price {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 1.3rem;
            color: #000;
            margin-bottom: 10px;
        }
        .item-controls {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 10px;
        }
        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .quantity-btn {
            width: 32px;
            height: 32px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        .quantity-btn:hover {
            background: #f5f5f5;
        }
        .quantity-input {
            width: 50px;
            height: 32px;
            border: 1px solid #ddd;
            border-radius: 4px;
            text-align: center;
            font-family: 'Montserrat', sans-serif;
        }
        .remove-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            font-weight: 500;
            transition: background 0.3s ease;
        }
        .remove-btn:hover {
            background: #c82333;
        }
        .cart-summary {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #eee;
        }
        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-family: 'Montserrat', sans-serif;
        }
        .summary-total {
            font-weight: 700;
            font-size: 1.3rem;
            border-top: 2px solid #ddd;
            padding-top: 15px;
            margin-top: 10px;
        }
        .checkout-btn {
            width: 100%;
            background: #000;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.3s ease;
        }
        .checkout-btn:hover {
            background: #333;
        }
        .checkout-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .empty-cart {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 12px;
            border: 1px solid #eee;
        }
        .empty-cart h2 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            margin-bottom: 15px;
            color: #666;
        }
        .empty-cart p {
            color: #888;
            margin-bottom: 25px;
        }
        .loading-message {
            text-align: center;
            padding: 40px;
            font-family: 'Montserrat', sans-serif;
            color: #666;
        }
        .error-message {
            text-align: center;
            padding: 40px;
            color: #dc3545;
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            border-radius: 8px;
            margin: 20px 0;
        }
        .item-description {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 5px;
            line-height: 1.3;
        }

        .item-article {
            color: #888;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
<!-- Хедер как в index.html -->
<header class="header">
    <div class="brand-section">
        <div class="slogan">"Tech Tested, Market Approved"</div>
        <div class="marketlab-title">
            <a href="/" style="text-decoration: none; color: inherit;">MARKETLAB</a>
        </div>
    </div>

    <div class="nav-buttons">
        <a href="#" class="nav-button" id="loginButton">
            <div class="icon-square">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                     stroke="black" style="width: 24px; height: 24px;">
                    <path stroke-linecap="round" stroke-linejoin="round"
                          d="M17.982 18.725A7.488 7.488 0 0 0 12 15.75a7.488 7.488 0 0 0-5.982 2.975m11.963 0a9 9 0 1 0-11.963 0m11.963 0A8.966 8.966 0 0 1 12 21a8.966 8.966 0 0 1-5.982-2.275M15 9.75a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                </svg>
            </div>
            <span class="button-text">Войти</span>
        </a>

        <a href="/cart" class="nav-button">
            <div class="icon-square">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                     stroke="black" style="width: 22px; height: 22px;">
                    <path stroke-linecap="round" stroke-linejoin="round"
                          d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 0 0-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 0 0 0-16.536-1.84M7.5 14.25 5.106 5.272M6 20.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Zm12.75 0a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Z" />
                </svg>
            </div>
            <span class="button-text">Корзина</span>
        </a>

        <div class="nav-button" id="categoriesDropdown">
            <div class="icon-square">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                     stroke="black" style="width: 24px; height: 24px;">
                    <path stroke-linecap="round" stroke-linejoin="round"
                          d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
                </svg>
            </div>
            <span class="button-text">Категории</span>
        </div>
    </div>
</header>

<main>
    <div class="cart-page">
        <div class="cart-header">
            <h1 class="cart-title">Корзина</h1>
            <div id="cartCounter" class="cart-counter-badge">0 товаров</div>
        </div>

        <div id="cartContent">
            <div class="loading-message">
                <p>Загрузка корзины...</p>
            </div>
        </div>
    </div>
</main>

<!-- Модалки и футер -->
<div id="loginModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Вход в MARKETLAB</h2>
            <span class="close">&times;</span>
        </div>
        <form class="login-form">
            <input type="text" placeholder="Email или логин" required>
            <input type="password" placeholder="Пароль" required>
            <button type="submit">Войти</button>
        </form>
        <div class="modal-links">
            <a href="#">Создать аккаунт</a>
        </div>
    </div>
</div>

<div id="registerModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Регистрация в MARKETLAB</h2>
            <span class="close-register">&times;</span>
        </div>
        <form class="register-form" id="registerForm">
            <input type="text" name="firstName" placeholder="Имя" required>
            <input type="text" name="middleName" placeholder="Отчество">
            <input type="text" name="lastName" placeholder="Фамилия" required>
            <input type="email" name="email" placeholder="Email" required>
            <input type="password" name="password" placeholder="Пароль" required>
            <input type="tel" name="phoneNumber" placeholder="Номер телефона">
            <button type="submit">Зарегистрироваться</button>
        </form>
        <div class="modal-links">
            <a href="#" class="switch-to-login">Уже есть аккаунт? Войти</a>
        </div>
    </div>
</div>

<script src="/js/auth.js"></script>
<script>
    // Cart Management with Vanilla JavaScript
    class CartPageManager {
        constructor() {
            this.cartContent = document.getElementById('cartContent');
            this.cartCounter = document.getElementById('cartCounter');
            this.init();
        }

        async init() {
            console.log('🛒 CartPageManager initialized');
            await this.loadCart();
            this.setupEventListeners();
        }

        setupEventListeners() {
            // Обработчик для кнопок удаления
            this.cartContent.addEventListener('click', (e) => {
                if (e.target.closest('.remove-btn')) {
                    const productId = e.target.closest('.remove-btn').dataset.productId;
                    this.removeFromCart(productId);
                }

                // Обработчики для изменения количества
                if (e.target.closest('.quantity-decrease')) {
                    const productId = e.target.closest('.quantity-controls').dataset.productId;
                    this.updateQuantity(productId, -1);
                }

                if (e.target.closest('.quantity-increase')) {
                    const productId = e.target.closest('.quantity-controls').dataset.productId;
                    this.updateQuantity(productId, 1);
                }

                if (e.target.closest('.quantity-input')) {
                    const input = e.target.closest('.quantity-input');
                    const productId = input.dataset.productId;
                    const newQuantity = parseInt(input.value);

                    if (newQuantity > 0) {
                        this.setQuantity(productId, newQuantity);
                    } else {
                        input.value = 1;
                    }
                }
            });
        }

        async loadCart() {
            const token = this.getToken();

            if (!token) {
                this.showLoginPrompt();
                return;
            }

            try {
                const response = await fetch('/api/cart', {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (response.ok) {
                    const cartData = await response.json();
                    this.renderCart(cartData);
                } else if (response.status === 401) {
                    this.showLoginPrompt();
                } else {
                    this.showError('Ошибка загрузки корзины');
                }
            } catch (error) {
                console.error('❌ Error loading cart:', error);
                this.showError('Не удалось загрузить корзину');
            }
        }

        renderCart(cartData) {
            if (!cartData || cartData.length === 0) {
                this.showEmptyCart();
                return;
            }

            const totalItems = cartData.reduce((sum, item) => sum + item.quantity, 0);
            const totalPrice = cartData.reduce((sum, item) => {
                const price = item.productPrice || 0;
                return sum + (price * item.quantity);
            }, 0);

            // Обновляем счетчик
            this.cartCounter.textContent = `${totalItems} ${this.getPluralForm(totalItems, 'товар', 'товара', 'товаров')}`;

            // Рендерим товары
            const itemsHtml = cartData.map(item => this.createCartItem(item)).join('');

            // Рендерим итоговую сумму
            const summaryHtml = this.createCartSummary(totalPrice, totalItems);

            this.cartContent.innerHTML = `
        <div class="cart-items">
            ${itemsHtml}
        </div>
        ${summaryHtml}
    `;
        }

        createCartItem(item) {
            const productName = item.productName || 'Название товара';
            const productPrice = item.productPrice || 0;
            const productId = item.productId;
            const imageUrl = `https://picsum.photos/120/120?random=${productId}`;

            return `
        <div class="cart-item" data-product-id="${productId}">
            <div class="item-image">
                <img src="${imageUrl}" alt="${productName}">
            </div>
            <div class="item-details">
                <div>
                    <h3 class="item-name">${this.escapeHtml(productName)}</h3>
                    <div class="item-price">${this.formatPrice(productPrice)} ₽</div>
                    ${item.productDescription ? `<p class="item-description">${this.escapeHtml(item.productDescription)}</p>` : ''}
                    ${item.productArticle ? `<small class="item-article">Артикул: ${item.productArticle}</small>` : ''}
                </div>
                <div class="item-controls">
                    <div class="quantity-controls" data-product-id="${productId}">
                        <button class="quantity-btn quantity-decrease">-</button>
                        <input type="number" class="quantity-input"
                               value="${item.quantity}"
                               min="1"
                               data-product-id="${productId}">
                        <button class="quantity-btn quantity-increase">+</button>
                    </div>
                    <button class="remove-btn" data-product-id="${productId}">
                        Удалить
                    </button>
                </div>
            </div>
        </div>
    `;
        }

        createCartSummary(totalPrice, totalItems) {
            return `
                <div class="cart-summary">
                    <div class="summary-row">
                        <span>Товары (${totalItems})</span>
                        <span>${this.formatPrice(totalPrice)} ₽</span>
                    </div>
                    <div class="summary-row">
                        <span>Доставка</span>
                        <span>Бесплатно</span>
                    </div>
                    <div class="summary-row summary-total">
                        <span>Итого</span>
                        <span>${this.formatPrice(totalPrice)} ₽</span>
                    </div>
                    <button class="checkout-btn" ${totalItems === 0 ? 'disabled' : ''}>
                        Перейти к оформлению
                    </button>
                </div>
            `;
        }

        async removeFromCart(productId) {
            const token = this.getToken();

            if (!token) {
                this.showLoginPrompt();
                return;
            }

            try {
                const response = await fetch(`/api/cart/remove/${productId}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (response.ok) {
                    this.showSuccess('Товар удален из корзины');
                    await this.loadCart(); // Перезагружаем корзину

                    // Обновляем счетчик в хедере
                    if (window.cartManager) {
                        window.cartManager.updateCartUI();
                    }
                } else {
                    this.showError('Ошибка при удалении товара');
                }
            } catch (error) {
                console.error('❌ Error removing from cart:', error);
                this.showError('Не удалось удалить товар');
            }
        }

        async updateQuantity(productId, change) {
            const input = document.querySelector(`.quantity-input[data-product-id="${productId}"]`);
            if (!input) return;

            const currentQuantity = parseInt(input.value);
            const newQuantity = Math.max(1, currentQuantity + change);

            await this.setQuantity(productId, newQuantity);
        }

        async setQuantity(productId, quantity) {
            const token = this.getToken();

            if (!token) {
                this.showLoginPrompt();
                return;
            }

            try {
                const response = await fetch(`/api/cart/update/${productId}/${quantity}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`,  // Убедитесь что этот заголовок присутствует
                        'Content-Type': 'application/json'
                    }
                });

                if (response.ok) {
                    await this.loadCart();
                    if (window.cartManager) {
                        window.cartManager.updateCartUI();
                    }
                } else {
                    this.showError('Ошибка при обновлении количества');
                }
            } catch (error) {
                console.error('❌ Error updating quantity:', error);
                this.showError('Не удалось обновить количество');
            }
        }

        showEmptyCart() {
            this.cartContent.innerHTML = `
                <div class="empty-cart">
                    <h2>Корзина пуста</h2>
                    <p>Добавьте товары в корзину, чтобы они отобразились здесь</p>
                    <a href="/" class="btn-primary">Перейти к покупкам</a>
                </div>
            `;
            this.cartCounter.textContent = '0 товаров';
        }

        showLoginPrompt() {
            this.cartContent.innerHTML = `
                <div class="empty-cart">
                    <h2>Войдите в аккаунт</h2>
                    <p>Для просмотра корзины необходимо авторизоваться</p>
                    <button class="btn-primary" onclick="document.getElementById('loginButton').click()">
                        Войти
                    </button>
                </div>
            `;
        }

        showError(message) {
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error-message';
            errorDiv.textContent = message;

            this.cartContent.prepend(errorDiv);

            setTimeout(() => {
                errorDiv.remove();
            }, 3000);
        }

        showSuccess(message) {
            const successDiv = document.createElement('div');
            successDiv.className = 'error-message';
            successDiv.style.background = '#d4edda';
            successDiv.style.color = '#155724';
            successDiv.style.borderColor = '#c3e6cb';
            successDiv.textContent = message;

            this.cartContent.prepend(successDiv);

            setTimeout(() => {
                successDiv.remove();
            }, 3000);
        }

        // Вспомогательные методы
        getToken() {
            let token = localStorage.getItem('authToken');
            if (!token || token === 'null' || token === 'undefined' || token === '' || token.length < 10) {
                return null;
            }
            return token;
        }

        formatPrice(price) {
            return new Intl.NumberFormat('ru-RU').format(price);
        }

        escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        getPluralForm(number, one, two, five) {
            let n = Math.abs(number);
            n %= 100;
            if (n >= 5 && n <= 20) {
                return five;
            }
            n %= 10;
            if (n === 1) {
                return one;
            }
            if (n >= 2 && n <= 4) {
                return two;
            }
            return five;
        }
    }

    // Инициализация при загрузке страницы
    document.addEventListener('DOMContentLoaded', () => {
        window.cartPageManager = new CartPageManager();
    });
</script>
</body>
</html>
